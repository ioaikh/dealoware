<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recovery code · Dealoware admin</title>
  <link rel="stylesheet" href="/admin/auth/css/admin-auth.css">
</head>
<body data-screen="S-A3">
  <main class="auth-shell">
    <div class="auth-card">
      <h1>Recovery code</h1>
      <p class="lede">Enter one unused recovery code.</p>
      <div id="form-alert" class="alert" role="alert" tabindex="-1" hidden></div>
      <form id="recovery-form" novalidate>
        <div class="field">
          <label for="recovery-code">Recovery code</label>
          <input id="recovery-code" name="recovery-code" type="text" autocomplete="off" aria-describedby="recovery-error" required>
          <span id="recovery-error" class="field-error" hidden></span>
        </div>
        <button type="submit" data-submit>Sign in</button>
        <div class="links">
          <a href="/admin/sign-in/code">Use an authenticator code instead</a>
          <a href="/admin/sign-in" id="back-to-signin">Back to sign in</a>
        </div>
      </form>
    </div>
  </main>
  <script src="/admin/auth/js/admin-dom.js"></script>
  <script src="/admin/auth/js/admin-copy.js"></script>
  <script src="/admin/auth/js/admin-api.js"></script>
  <script src="/admin/auth/js/admin-password.js"></script>
  <script src="/admin/auth/js/admin-turnstile.js"></script>
  <script src="/admin/auth/js/admin-app.js"></script>
</body>
</html>
