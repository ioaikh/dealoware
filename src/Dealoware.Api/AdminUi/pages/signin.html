<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · Dealoware admin</title>
  <link rel="stylesheet" href="/admin/auth/css/admin-auth.css">
</head>
<body data-screen="S-A1">
  <main class="auth-shell">
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="lede">Sign in to Dealoware admin.</p>
      <div id="status-region" class="status" hidden></div>
      <div id="form-alert" class="alert" role="alert" tabindex="-1" hidden></div>
      <form id="signin-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" aria-describedby="email-error" required>
          <span id="email-error" class="field-error" hidden></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="field-row">
            <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error" required>
            <button type="button" id="password-toggle" class="secondary toggle" aria-pressed="false">Show</button>
          </div>
          <span id="password-error" class="field-error" hidden></span>
        </div>
        <div class="turnstile" id="turnstile">
          <p id="turnstile-status" class="turnstile-status"></p>
          <div id="turnstile-widget"></div>
          <button type="button" id="turnstile-retry" class="secondary" hidden>Retry</button>
        </div>
        <button type="submit" data-submit disabled>Sign in</button>
      </form>
    </div>
  </main>
  <script src="/admin/auth/js/admin-dom.js"></script>
  <script src="/admin/auth/js/admin-copy.js"></script>
  <script src="/admin/auth/js/admin-api.js"></script>
  <script src="/admin/auth/js/admin-password.js"></script>
  <script src="/admin/auth/js/admin-turnstile.js"></script>
  <script src="/admin/auth/js/admin-app.js"></script>
</body>
</html>
