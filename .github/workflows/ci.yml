name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A manual run can rehearse the upgrade from any commit as if it were a release (T09a or
  # later), so the rehearsal can be exercised before release-1.
  workflow_dispatch:
    inputs:
      previous_ref:
        description: 'Commit (full hash) to rehearse the upgrade from, as if it were a release. Empty: the last release-* tag.'
        required: false
        default: ''

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --filter "FullyQualifiedName!~AdminAuditPostgres"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/Sequence_*.xml
          retention-days: 30

  # T09 spec §2.2: between two releases the database only gains. Reads every migration added
  # since the last release-* tag, so it needs the full history and the tags. Without a tag
  # there is no previous release, and it says so and passes.
  database-changes:
    name: Database changes since the last release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check the migrations since the last release
        env:
          DEALOWARE_RELEASE_MIGRATION_CHECK: required
        run: >
          dotnet test --no-build --configuration Release
          --filter "FullyQualifiedName~ReleaseMigrationRulesTests"
          --logger "console;verbosity=detailed"

  postgres-sec:
    name: PostgreSQL Sec Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealoware_ci
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: dealoware_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealoware_ci -d dealoware_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: dealoware_ci
      DB_USERNAME: dealoware_ci
      DB_PASSWORD: ci_throwaway_not_a_secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Sec* parallel tests, one full second-factor sign-in, reset IP bursts, the S-A12 settings class, the admin edit and delete classes, the offer-history class, the health answers, the database logins class, and the dbcheck class
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=postgres-sec-results.trx"
          --filter "FullyQualifiedName~SecR|FullyQualifiedName~SecSc|FullyQualifiedName~SecN8|FullyQualifiedName~TdAdm020_TotpRequiredOnEveryPostEnrollmentLogin|FullyQualifiedName~AdminAuditPostgres|FullyQualifiedName~SC6_R3_ParallelBurst|FullyQualifiedName~SC6_B2_ParallelBadTokenBurst|FullyQualifiedName~SC6_R5_ExpiredRowParallelBurst|FullyQualifiedName~SC6_R5_DelayedReset|FullyQualifiedName~SC6_R10_PostgresParallelConfirm|FullyQualifiedName~C2_PostgresParallelWrongCodes|FullyQualifiedName~B2_PostgresFactorLock|FullyQualifiedName~G1_PostgresUnknownEmail|FullyQualifiedName~AdminSecuritySettingsTests|FullyQualifiedName~AdminEditApiTests|FullyQualifiedName~AdminDeleteApiTests|FullyQualifiedName~AdminOfferHistoryTests|FullyQualifiedName~HealthEndpointTests|FullyQualifiedName~DatabaseRolesPostgresTests|FullyQualifiedName~DatabaseCheckPostgresTests"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Upload PostgreSQL test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-sec-test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/Sequence_*.xml
          retention-days: 30

  # T09 spec, deliverable 3: the image is built from the Dockerfile on every pull request and
  # on main, with the commit as GIT_SHA. Nothing is pushed anywhere: a release builds its own
  # image on the deploy machine. The built image is started once to show it answers its
  # own version.
  image-build:
    name: Image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the image (no push)
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker build --build-arg "GIT_SHA=$GIT_SHA" --tag dealoware-engine:ci .

      - name: The image answers the commit it was built from
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker inspect dealoware-engine:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GIT_SHA"
          # Development on the image's own SQLite file: no database server is needed for the
          # health answers. Even Development refuses to start without the three admin keys,
          # so each run makes up throwaway ones (test-only, never real values).
          # The image listens on 8080 (ASPNETCORE_URLS=http://+:8080 in the Dockerfile).
          docker run --detach --name engine             --env ASPNETCORE_ENVIRONMENT=Development             --env DEALOWARE_ADMIN_RECOVERY_HMAC_KEY="$(openssl rand -base64 32)"             --env DEALOWARE_ADMIN_TOTP_KEY="$(openssl rand -base64 32)"             --env DEALOWARE_ADMIN_IP_HMAC_KEY="$(openssl rand -base64 32)"             --publish 127.0.0.1:8080:8080 dealoware-engine:ci
          ok=""
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/health > health.json; then ok=yes; break; fi
            if [ "$(docker inspect engine --format '{{ .State.Running }}')" != "true" ]; then break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "The container did not answer /health."
            docker inspect engine --format 'state={{ .State.Status }} exit={{ .State.ExitCode }} error={{ .State.Error }}'
            docker logs engine 2>&1 | tail -n 100
            exit 1
          fi
          cat health.json; echo
          expected="${GIT_SHA:0:7}"
          test "$(jq -r .version health.json)" = "$expected"
          test "$(jq -r .status health.json)" = "ok"
          curl --silent --fail http://127.0.0.1:8080/health/ready | tee ready.json; echo
          test "$(jq -r .version ready.json)" = "$expected"
          test "$(jq -r .status ready.json)" = "ok"

      - name: Container state and log on failure
        if: failure()
        run: |
          docker inspect engine --format 'state={{ .State.Status }} exit={{ .State.ExitCode }} error={{ .State.Error }}' || true
          docker logs engine 2>&1 | tail -n 100 || true

  # T09 spec §2.3: the previous release must keep working on this commit's schema. Until there
  # is a test copy, this rehearsal stands in for it. Skipped, with a note, while no release-*
  # tag exists: before the first release there is no previous release.
  upgrade-rehearsal:
    name: Upgrade rehearsal from the last release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the last release tag
        id: last
        env:
          PREVIOUS_REF: ${{ github.event.inputs.previous_ref }}
        run: |
          set -euo pipefail
          if [ -n "${PREVIOUS_REF:-}" ]; then
            if ! echo "$PREVIOUS_REF" | grep -Eq '^[0-9a-f]{40}$'; then echo "previous_ref must be a full commit hash" >&2; exit 1; fi
            echo "tag=$PREVIOUS_REF" >> "$GITHUB_OUTPUT"
            echo "Manual run: rehearsing the upgrade from $PREVIOUS_REF as if it were a release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="$(git tag --list 'release-*' --merged HEAD | grep -E '^release-[0-9]+$' | sort -t- -k2,2n | tail -n 1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No release-* tag yet: there is no previous release to rehearse an upgrade from. Skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Rehearsing the upgrade from $tag." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup .NET
        if: steps.last.outputs.tag != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Rehearse the upgrade on PostgreSQL 16
        if: steps.last.outputs.tag != ''
        env:
          PREV_TAG: ${{ steps.last.outputs.tag }}
        run: bash scripts/upgrade-rehearsal/run.sh "$PREV_TAG"

  # T58a (specification §3.4): H3 on a new, empty database, in the order a fresh deployment
  # runs it, over TLS VerifyFull as in production: dbroles twice, migrate, dbroles --verify,
  # the API on dealoware_app (/health 200), and a refused start on the master login.
  # Certificates and passwords are throwaway values made in the job; none is printed.
  new-database-rehearsal:
    name: New database rehearsal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Start PostgreSQL 16 with TLS
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          tls="$RUNNER_TEMP/pg-tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=rehearsal-ca" \
            -keyout "$tls/ca.key" -out "$tls/ca.pem" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" \
            -keyout "$tls/server.key" -out "$tls/server.csr" 2>/dev/null
          printf 'subjectAltName=DNS:localhost\n' > "$tls/san.ext"
          openssl x509 -req -in "$tls/server.csr" -CA "$tls/ca.pem" -CAkey "$tls/ca.key" -CAcreateserial \
            -days 1 -extfile "$tls/san.ext" -out "$tls/server.crt" 2>/dev/null
          rm -f "$tls/ca.key" "$tls/server.csr"
          # The server runs as uid 999 in the image and refuses a key others can read.
          sudo chown 999:999 "$tls/server.key" "$tls/server.crt"
          sudo chmod 600 "$tls/server.key"
          superpw="$(openssl rand -hex 24)"
          echo "::add-mask::$superpw"
          echo "REHEARSAL_PG_SUPERPASSWORD=$superpw" >> "$GITHUB_ENV"
          echo "REHEARSAL_CA=$tls/ca.pem" >> "$GITHUB_ENV"
          docker run -d --name rehearsal-pg -p 5432:5432 -e POSTGRES_PASSWORD="$superpw" \
            -v "$tls/server.crt:/tls/server.crt:ro" -v "$tls/server.key:/tls/server.key:ro" \
            postgres:16 -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key >/dev/null
          for _ in $(seq 1 60); do
            docker exec rehearsal-pg pg_isready -q -U postgres -h 127.0.0.1 && break
            sleep 1
          done
          docker exec rehearsal-pg pg_isready -U postgres -h 127.0.0.1
          docker exec rehearsal-pg postgres --version

      - name: Rehearse dbroles, migrate, dbroles --verify, dbcheck and the API start
        env:
          REHEARSAL_PG_HOST: localhost
          REHEARSAL_PG_PORT: '5432'
        run: bash scripts/new-database-rehearsal.sh

      - name: PostgreSQL log
        if: failure()
        run: docker logs rehearsal-pg 2>&1 | tail -n 100
