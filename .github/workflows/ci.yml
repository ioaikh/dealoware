name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --filter "FullyQualifiedName!~AdminAuditPostgres"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/Sequence_*.xml
          retention-days: 30

  # T09 spec §2.2: between two releases the database only gains. Reads every migration added
  # since the last release-* tag, so it needs the full history and the tags. Without a tag
  # there is no previous release, and it says so and passes.
  database-changes:
    name: Database changes since the last release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check the migrations since the last release
        env:
          DEALOWARE_RELEASE_MIGRATION_CHECK: required
        run: >
          dotnet test --no-build --configuration Release
          --filter "FullyQualifiedName~ReleaseMigrationRulesTests"
          --logger "console;verbosity=detailed"

  postgres-sec:
    name: PostgreSQL Sec Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealoware_ci
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: dealoware_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealoware_ci -d dealoware_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: dealoware_ci
      DB_USERNAME: dealoware_ci
      DB_PASSWORD: ci_throwaway_not_a_secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Sec* parallel tests, one full second-factor sign-in, reset IP bursts, the S-A12 settings class, the admin edit and delete classes, the offer-history class, and the health answers
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=postgres-sec-results.trx"
          --filter "FullyQualifiedName~SecR|FullyQualifiedName~SecSc|FullyQualifiedName~SecN8|FullyQualifiedName~TdAdm020_TotpRequiredOnEveryPostEnrollmentLogin|FullyQualifiedName~AdminAuditPostgres|FullyQualifiedName~SC6_R3_ParallelBurst|FullyQualifiedName~SC6_B2_ParallelBadTokenBurst|FullyQualifiedName~SC6_R5_ExpiredRowParallelBurst|FullyQualifiedName~SC6_R5_DelayedReset|FullyQualifiedName~SC6_R10_PostgresParallelConfirm|FullyQualifiedName~C2_PostgresParallelWrongCodes|FullyQualifiedName~B2_PostgresFactorLock|FullyQualifiedName~G1_PostgresUnknownEmail|FullyQualifiedName~AdminSecuritySettingsTests|FullyQualifiedName~AdminEditApiTests|FullyQualifiedName~AdminDeleteApiTests|FullyQualifiedName~AdminOfferHistoryTests|FullyQualifiedName~HealthEndpointTests"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Upload PostgreSQL test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-sec-test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/Sequence_*.xml
          retention-days: 30

  # T09 spec, deliverable 3: the image is built from the Dockerfile on every pull request and
  # on main, with the commit as GIT_SHA. Nothing is pushed anywhere: a release builds its own
  # image on the deploy machine. The built image is started once to show it answers its
  # own version.
  image-build:
    name: Image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the image (no push)
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker build --build-arg "GIT_SHA=$GIT_SHA" --tag dealoware-engine:ci .

      - name: The image answers the commit it was built from
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker inspect dealoware-engine:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GIT_SHA"
          docker run --detach --name engine --env ASPNETCORE_ENVIRONMENT=Development --publish 127.0.0.1:8080:8080 dealoware-engine:ci
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/health > health.json; then break; fi
            sleep 2
          done
          cat health.json; echo
          expected="${GIT_SHA:0:7}"
          test "$(jq -r .version health.json)" = "$expected"
          test "$(jq -r .status health.json)" = "ok"
          curl --silent --fail http://127.0.0.1:8080/health/ready | tee ready.json; echo
          test "$(jq -r .version ready.json)" = "$expected"

      - name: Container log on failure
        if: failure()
        run: docker logs engine || true
