# Admin UI Headless CI — UX1-X08 / TD-ADM-UI-ci-01
# Merge-blocking: failing non-SKIP UI case fails the check.
# Empty suite: must fail closed on pull_request (never green empty).
# SKIP stubs: reported as SKIP with Active hold reason when specs missing.
# Decision: Chief QA AGREED — Brief 4 Playwright optional overruled for admin-UI PR gate.
#
# Phase 0: No admin UI frontend exists yet. Pipeline wiring only.
# When specs land, they run against webServer defined in e2e/playwright.config.ts.
# See e2e/admin/README.md for environment setup and local development.

name: Admin UI CI

on:
  pull_request:
    paths:
      # Admin UI e2e test files
      - 'e2e/admin/**'
      # Playwright configuration and dependencies
      - 'e2e/playwright.config.ts'
      - 'e2e/package.json'
      - 'e2e/package-lock.json'
      # This workflow
      - '.github/workflows/admin-ui-ci.yml'
  workflow_dispatch:
    inputs:
      allow_skip_empty:
        description: 'Allow SKIP on empty suite (manual dry-run only, not for pull_request)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  admin-ui-test:
    name: Admin UI Headless Tests (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deny-live guard — block admin.core.dealoware.com
        id: deny-live
        shell: bash
        # Scope ADMIN_BASE_URL here so deny-live checks the same URL Playwright uses.
        # Only this env var is needed; other secrets stay on test step only.
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL || 'http://127.0.0.1:4173' }}
        run: |
          # Check the resolved URL for live admin hosts.
          # Do NOT echo secret values — only report pass/fail and blocked pattern.
          BASE_URL="${ADMIN_BASE_URL:-http://127.0.0.1:4173}"

          # Extract hostname from URL (strips scheme and port/path)
          extract_host() {
            echo "$1" | sed -E 's|^https?://||' | sed -E 's|[:/].*||'
          }

          HOST=$(extract_host "$BASE_URL")

          # Deny pattern: admin.core.dealoware.com or admin*.dealoware.com
          if [[ "$HOST" == "admin.core.dealoware.com" ]]; then
            echo "::error::DENY-LIVE: ADMIN_BASE_URL resolves to admin.core.dealoware.com — forbidden."
            exit 1
          fi

          if [[ "$HOST" =~ ^admin.*\.dealoware\.com$ ]]; then
            echo "::error::DENY-LIVE: ADMIN_BASE_URL matches admin*.dealoware.com pattern — forbidden."
            exit 1
          fi

          echo "✓ Deny-live guard passed: ADMIN_BASE_URL does not point to live admin dealoware hosts."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Check for Playwright specs
        id: check-specs
        shell: bash
        run: |
          echo "::group::Spec discovery"

          # Search for Playwright spec files in admin UI test directories
          SPEC_PATTERNS=(
            "e2e/admin/*.spec.ts"
            "e2e/admin/*.spec.js"
            "e2e/admin/*.e2e.ts"
            "e2e/admin/*.e2e.js"
            "e2e/admin/**/*.spec.ts"
            "e2e/admin/**/*.spec.js"
            "e2e/admin/**/*.e2e.ts"
            "e2e/admin/**/*.e2e.js"
          )

          FOUND_SPECS=0
          for pattern in "${SPEC_PATTERNS[@]}"; do
            count=$(find . -path "./$pattern" 2>/dev/null | wc -l)
            FOUND_SPECS=$((FOUND_SPECS + count))
          done

          echo "Found $FOUND_SPECS spec file(s)"
          echo "specs_found=$FOUND_SPECS" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Fail-closed on empty suite (pull_request)
        if: github.event_name == 'pull_request' && steps.check-specs.outputs.specs_found == '0'
        shell: bash
        run: |
          echo "::error::FAIL-CLOSED: No Playwright specs found for admin UI."
          echo ""
          echo "═══════════════════════════════════════════════════════════════════════════"
          echo "  TD-ADM-UI-ci-01 — Active Hold: Admin UI Playwright specs pending"
          echo "═══════════════════════════════════════════════════════════════════════════"
          echo ""
          echo "  This PR touches admin UI e2e files but no Playwright specs exist yet."
          echo "  Per UX1-X08 decision: empty suite must fail closed on pull_request."
          echo ""
          echo "  Next steps:"
          echo "    1. Add Playwright specs under e2e/admin/"
          echo "    2. Or wait for TD-ADM-UI-ci-01 completion"
          echo ""
          echo "  References:"
          echo "    - Epic: UX1-X08"
          echo "    - Task: TD-ADM-UI-ci-01"
          echo "    - Decision: Chief QA AGREED"
          echo ""
          exit 1

      - name: Skip on empty suite (workflow_dispatch with allow_skip_empty)
        if: github.event_name == 'workflow_dispatch' && inputs.allow_skip_empty == 'true' && steps.check-specs.outputs.specs_found == '0'
        shell: bash
        run: |
          echo "::warning::SKIP: No specs found; allow_skip_empty=true on workflow_dispatch."
          echo ""
          echo "TD-ADM-UI-ci-01 — Active Hold: Admin UI Playwright specs pending"
          echo "Manual dry-run mode: skipping empty suite."
          echo ""
          # Exit 0 — allowed only for workflow_dispatch with explicit skip flag
          exit 0

      - name: Fail on empty suite (workflow_dispatch without allow_skip_empty)
        if: github.event_name == 'workflow_dispatch' && inputs.allow_skip_empty != 'true' && steps.check-specs.outputs.specs_found == '0'
        shell: bash
        run: |
          echo "::error::FAIL-CLOSED: No Playwright specs found for admin UI."
          echo ""
          echo "TD-ADM-UI-ci-01 — Active Hold: Admin UI Playwright specs pending"
          echo "Use allow_skip_empty=true for manual dry-run if needed."
          exit 1

      - name: Install Playwright Chromium
        if: steps.check-specs.outputs.specs_found != '0'
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests (Chromium)
        if: steps.check-specs.outputs.specs_found != '0'
        working-directory: e2e
        # Secrets scoped to test step only — never exposed to npm install or other steps.
        # Values below are CI test placeholders; configure real secrets in GitHub repo settings.
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL || 'http://127.0.0.1:4173' }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'ci-test-admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'ci-test-placeholder-not-real' }}
          COREOWNER_PASSWORD_ENV: ${{ secrets.COREOWNER_PASSWORD_ENV || 'ci-test-placeholder-not-real' }}
          TOTP_SEED_ENV: ${{ secrets.TOTP_SEED_ENV || 'JBSWY3DPEHPK3PXP' }}
          TURNSTILE_TEST_SITE_KEY: ${{ secrets.TURNSTILE_TEST_SITE_KEY || '1x00000000000000000000AA' }}
          TURNSTILE_TEST_SECRET_KEY: ${{ secrets.TURNSTILE_TEST_SECRET_KEY || '1x0000000000000000000000000000000AA' }}
        run: |
          npx playwright test \
            -c playwright.config.ts \
            --project=chromium \
            --reporter=html \
            --reporter=list

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.check-specs.outputs.specs_found != '0'
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && steps.check-specs.outputs.specs_found != '0'
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure() && steps.check-specs.outputs.specs_found != '0'
        with:
          name: playwright-traces
          path: e2e/test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore
