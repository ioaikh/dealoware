# Admin UI CI — UX1-X08 / UXR-D15 / TD-ADM-UI-ci-01
#
# The browser tests of the Core admin pages, on every pull request that
# touches what those pages are built from. Rule: Story A7 step 14 ("Headless
# UI cases are required in CI on every PR that touches admin UI files").
# Decision: docs/qa/2026-10-05__qa__decision__ux1-x08-headless-ui-ci.md.
#
# What runs: e2e/run-signed-out.sh. It finds every suite built on the shared
# runner (each e2e/<suite>/run.sh that sources e2e/signed-out/harness.sh) and
# runs them one after the other, against the real application over HTTPS. A
# new suite folder is picked up without an edit here. One job per browser
# engine, side by side; one engine failing does not stop the others.
#
# Fail closed, never a green empty run:
# - a failing test fails the job;
# - no suite found, or a suite that collected no test, fails the job;
# - SKIP is not PASS (AC-06): a suite whose tests were all skipped fails the
#   job. The count comes from Playwright's JSON report, read by
#   e2e/admin/ci/assert-executed.js; the negative control below proves that
#   script on real reports in every job;
# - a test.only left in a spec fails the job (--forbid-only);
# - no continue-on-error, no "|| true", no "if: always()".
#
# SECURITY (public repository — logs and artifacts are world-readable):
# - No secrets. This workflow reads none and needs none: the passwords, keys
#   and tokens of a run are made up by the runner script when it starts and
#   are gone when the job ends. Do NOT add real CoreOwner or admin passwords,
#   TOTP seeds or Turnstile keys to this repository's Actions secrets.
# - Nothing leaves the runner. The pages are opened under the admin host's
#   name, but every browser connection goes through a proxy on 127.0.0.1 to
#   the application started in this job, and the suites answer Cloudflare's
#   requests themselves. Each suite's Playwright configuration refuses to
#   load with a proxy that is not http://127.0.0.1:<port> (the guard is
#   e2e/reset-confirm/require-proxy.cjs; its own checks run below). This
#   replaces the earlier check on ADMIN_BASE_URL: there is no base URL to set
#   any more.
# - No artifact uploads. Playwright traces, screenshots and video are off
#   (e2e/signed-out/playwright.base.cjs). The screenshots and axe reports the
#   suites save stay in the job's workspace and go away with it. Do not
#   upload them until a private artifact policy or a private runner exists.
# - pull_request only (never pull_request_target), a read-only token, and no
#   credentials left in the checkout.

name: Admin UI CI

on:
  pull_request:
    paths:
      # The suites build and start the whole application, so everything it is
      # built from counts: the admin pages and their assets
      # (src/Dealoware.Api/Admin/**, src/Dealoware.Api/wwwroot/admin/**), and
      # also Program.cs (middleware order, security headers, rate limits),
      # the sign-in, password and authenticator code in Infrastructure and
      # Domain, and the migrations whose tables the suites write rows into.
      - 'src/**'
      # The suites, the shared runner, their pinned packages.
      - 'e2e/**'
      # This workflow.
      - '.github/workflows/admin-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ui-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  admin-ui-test:
    name: Admin UI Headless Tests (${{ matrix.engine }})
    # Not ubuntu-latest, which has moved on to a newer Ubuntu: the pinned
    # Playwright (1.48.0) knows the system packages and has browser builds
    # for Ubuntu up to 24.04. Move this together with that pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      # The one engine this job runs; e2e/signed-out/harness.sh reads it.
      E2E_ENGINES: ${{ matrix.engine }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up the .NET 10 SDK
        # A plain step: no setup-dotnet commit is pinned in this repository.
        # Uses the SDK on the runner image when it has one, and Microsoft's
        # install script otherwise. As in ci.yml there is no global.json, so
        # a newer SDK on the runner may do the build; the application targets
        # .NET 10 and runs on the .NET 10 runtime either way.
        run: |
          sdks=""
          if command -v dotnet >/dev/null 2>&1; then
            sdks="$(dotnet --list-sdks)"
          fi
          if grep -q '^10\.0\.' <<<"$sdks"; then
            echo "The runner image has a .NET 10 SDK."
          else
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
            bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
            echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'e2e/**/package-lock.json'

      - name: Tool versions
        run: |
          dotnet --version
          node --version
          python3 --version
          openssl version

      - name: Loopback guard — the browser may only be sent to this runner
        # The checks of the guard every suite's Playwright configuration
        # loads: a proxy anywhere but http://127.0.0.1:<port> is refused.
        run: node e2e/reset-confirm/require-proxy.check.cjs

      - name: Install the pinned Playwright
        # e2e/package.json holds the one Playwright version every suite pins.
        working-directory: e2e
        run: npm ci

      - name: Negative control — AC-06 fixture reports
        working-directory: e2e
        # Recapture real Playwright JSON reports, then prove that the script
        # the run below relies on turns a run that executed nothing red.
        run: |
          node admin/ci/capture-fixtures.js
          node --test admin/ci/assert-executed.control.js

      - name: Install the browser with its system dependencies
        working-directory: e2e
        run: npx playwright install --with-deps "$E2E_ENGINES"

      - name: Build the application
        # Once, in the configuration "dotnet run" starts. Each suite's
        # "dotnet run" then finds it up to date.
        run: dotnet build src/Dealoware.Api/Dealoware.Api.csproj

      - name: Run the browser suites
        run: bash e2e/run-signed-out.sh --forbid-only

      # PUBLIC REPO: no artifact uploads (see SECURITY above).
