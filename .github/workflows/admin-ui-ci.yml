# Admin UI Headless CI — UX1-X08 / TD-ADM-UI-ci-01
# Merge-blocking: failing non-SKIP UI case fails the check.
# Empty suite: must fail closed on pull_request (never green empty).
# SKIP stubs: reported as SKIP with Active hold reason when specs missing.
# Decision: Chief QA AGREED — Brief 4 Playwright optional overruled for admin-UI PR gate.
#
# Phase 0: No admin UI frontend exists yet. Pipeline wiring only.
# When specs land, they run against webServer defined in e2e/playwright.config.ts.
# See e2e/admin/README.md for environment setup and local development.
#
# SECURITY (public repo):
# - Traces/screenshots disabled (playwright.config.ts) — artifacts are world-readable.
# - No artifact uploads until private artifact policy or private runner exists.
# - Env placeholders are test-only stubs. Do NOT put real CoreOwner/admin passwords
#   or TOTP seeds into this public repo's Actions secrets.

name: Admin UI CI

on:
  pull_request:
    paths:
      # Admin UI e2e test files
      - 'e2e/admin/**'
      # Playwright configuration and dependencies
      - 'e2e/playwright.config.ts'
      - 'e2e/package.json'
      - 'e2e/package-lock.json'
      # Local Step 14 suite (same cases)
      - 'tests/admin-ui/**'
      - 'src/Dealoware.Api/AdminUi/**'
      - 'src/Dealoware.Api/wwwroot/admin/**'
      # This workflow
      - '.github/workflows/admin-ui-ci.yml'
  workflow_dispatch:
    inputs:
      allow_skip_empty:
        description: 'Allow SKIP on empty suite (manual dry-run only, not for pull_request)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: admin-ui-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admin-ui-test:
    name: Admin UI Headless Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Deny-live guard — allow-list localhost only
        id: deny-live
        shell: bash
        # Scope ADMIN_BASE_URL here so deny-live checks the same URL Playwright uses.
        # Only this env var is needed; other secrets stay on test step only.
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL || 'http://127.0.0.1:4173' }}
        run: |
          # Allow-list guard: only localhost/127.0.0.1/::1 with http(s) scheme.
          # Uses Node.js URL parser for robust validation.
          # Never echoes URL or secret values — only pass/fail + reason code.

          node --eval "
            const raw = process.env.ADMIN_BASE_URL || '';

            // REJECT: empty or missing
            if (!raw.trim()) {
              console.log('::error::DENY-LIVE: ADMIN_BASE_URL is empty or missing [E_EMPTY]');
              process.exit(1);
            }

            let url;
            try {
              url = new URL(raw);
            } catch {
              console.log('::error::DENY-LIVE: ADMIN_BASE_URL is not a valid URL [E_PARSE]');
              process.exit(1);
            }

            // REJECT: userinfo present (user:pass@host)
            if (url.username || url.password) {
              console.log('::error::DENY-LIVE: ADMIN_BASE_URL contains userinfo [E_USERINFO]');
              process.exit(1);
            }

            // REJECT: non-http(s) scheme
            const scheme = url.protocol.toLowerCase();
            if (scheme !== 'http:' && scheme !== 'https:') {
              console.log('::error::DENY-LIVE: ADMIN_BASE_URL has disallowed scheme [E_SCHEME]');
              process.exit(1);
            }

            // Normalize hostname: lowercase, strip trailing dot
            let host = url.hostname.toLowerCase();
            if (host.endsWith('.')) {
              host = host.slice(0, -1);
            }

            // ALLOW-LIST: only localhost, 127.0.0.1, ::1
            const allowed = ['localhost', '127.0.0.1', '::1'];
            if (!allowed.includes(host)) {
              console.log('::error::DENY-LIVE: ADMIN_BASE_URL hostname not in allow-list [E_HOST_DENY]');
              process.exit(1);
            }

            console.log('✓ Deny-live guard passed: ADMIN_BASE_URL is localhost.');
          "

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Check for Playwright specs
        id: check-specs
        shell: bash
        run: |
          echo "::group::Spec discovery"

          # Search for Playwright spec files in admin UI test directories
          SPEC_PATTERNS=(
            "e2e/admin/*.spec.ts"
            "e2e/admin/*.spec.js"
            "e2e/admin/*.e2e.ts"
            "e2e/admin/*.e2e.js"
            "e2e/admin/**/*.spec.ts"
            "e2e/admin/**/*.spec.js"
            "e2e/admin/**/*.e2e.ts"
            "e2e/admin/**/*.e2e.js"
          )

          FOUND_SPECS=0
          for pattern in "${SPEC_PATTERNS[@]}"; do
            count=$(find . -path "./$pattern" 2>/dev/null | wc -l)
            FOUND_SPECS=$((FOUND_SPECS + count))
          done

          echo "Found $FOUND_SPECS spec file(s)"
          echo "specs_found=$FOUND_SPECS" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Fail-closed on empty suite (pull_request)
        if: github.event_name == 'pull_request' && steps.check-specs.outputs.specs_found == '0'
        shell: bash
        run: |
          echo "::error::FAIL-CLOSED: No Playwright specs found for admin UI."
          echo ""
          echo "═══════════════════════════════════════════════════════════════════════════"
          echo "  TD-ADM-UI-ci-01 — Active Hold: Admin UI Playwright specs pending"
          echo "═══════════════════════════════════════════════════════════════════════════"
          echo ""
          echo "  This PR touches admin UI e2e files but no Playwright specs exist yet."
          echo "  Per UX1-X08 decision: empty suite must fail closed on pull_request."
          echo ""
          echo "  Next steps:"
          echo "    1. Add Playwright specs under e2e/admin/"
          echo "    2. Or wait for TD-ADM-UI-ci-01 completion"
          echo ""
          echo "  References:"
          echo "    - Epic: UX1-X08"
          echo "    - Task: TD-ADM-UI-ci-01"
          echo "    - Decision: Chief QA AGREED"
          echo ""
          exit 1

      - name: Skip on empty suite (workflow_dispatch with allow_skip_empty)
        if: github.event_name == 'workflow_dispatch' && inputs.allow_skip_empty == 'true' && steps.check-specs.outputs.specs_found == '0'
        shell: bash
        run: |
          echo "::warning::SKIP: No specs found; allow_skip_empty=true on workflow_dispatch."
          echo ""
          echo "TD-ADM-UI-ci-01 — Active Hold: Admin UI Playwright specs pending"
          echo "Manual dry-run mode: skipping empty suite."
          echo ""
          # Exit 0 — allowed only for workflow_dispatch with explicit skip flag
          exit 0

      - name: Fail on empty suite (workflow_dispatch without allow_skip_empty)
        if: github.event_name == 'workflow_dispatch' && inputs.allow_skip_empty != 'true' && steps.check-specs.outputs.specs_found == '0'
        shell: bash
        run: |
          echo "::error::FAIL-CLOSED: No Playwright specs found for admin UI."
          echo ""
          echo "TD-ADM-UI-ci-01 — Active Hold: Admin UI Playwright specs pending"
          echo "Use allow_skip_empty=true for manual dry-run if needed."
          exit 1

      - name: Setup .NET
        if: steps.check-specs.outputs.specs_found != '0'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Playwright Chromium
        if: steps.check-specs.outputs.specs_found != '0'
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests (Chromium)
        if: steps.check-specs.outputs.specs_found != '0'
        working-directory: e2e
        # Secrets scoped to test step only — never exposed to npm install or other steps.
        # PUBLIC REPO: Use test-only placeholder values. Do NOT put real CoreOwner/admin
        # passwords or TOTP seeds into this repo's Actions secrets — artifacts and logs
        # are world-readable.
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL || 'http://127.0.0.1:4173' }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'ci-test-admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'ci-test-placeholder-not-real' }}
          COREOWNER_PASSWORD_ENV: ${{ secrets.COREOWNER_PASSWORD_ENV || 'ci-test-placeholder-not-real' }}
          TOTP_SEED_ENV: ${{ secrets.TOTP_SEED_ENV || 'JBSWY3DPEHPK3PXP' }}
          TURNSTILE_TEST_SITE_KEY: ${{ secrets.TURNSTILE_TEST_SITE_KEY || '1x00000000000000000000AA' }}
          TURNSTILE_TEST_SECRET_KEY: ${{ secrets.TURNSTILE_TEST_SECRET_KEY || '1x0000000000000000000000000000000AA' }}
        run: |
          npx playwright test \
            -c playwright.config.ts \
            --project=chromium \
            --reporter=list

      # PUBLIC REPO: Artifact uploads disabled.
      # Traces, screenshots, and test results may contain credentials, cookies, or
      # session data. Do not upload until a private artifact policy or private runner
      # is in place. See playwright.config.ts for trace/screenshot settings.
